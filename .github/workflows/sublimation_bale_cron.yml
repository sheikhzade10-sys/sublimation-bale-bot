name: 24/7 Sublimation Leads Cron to Bale

on:
  schedule:
    # Runs every 2 hours 24/7/365 on GitHub Cloud completely independent of your PC
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  run-sublimation-bale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Sublimation Discovery & Bale Delivery
        env:
          BALE_BOT_TOKEN: '2136077232:6UYkuEA0H6FyPXbZB0lH38Hy1GjKpojSsv8'
          BALE_CHAT_ID: '4657775638'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node standalone-worker.mjs --once

      - name: Commit & Push updated leads and delivery log
        run: |
          git config --global user.name "Sublimation Cloud Bot"
          git config --global user.email "bot@sublimation.ir"
          git add work/ outputs/ || true
          git diff --staged --quiet || (git commit -m "chore: auto-deliver new sublimation leads to Bale [skip ci]" && git push)
