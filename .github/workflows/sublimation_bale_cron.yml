name: 24/7 Sublimation Leads Cron to Bale

on:
  schedule:
    # Off-peak minutes (:17 and :47) avoid GitHub top-of-hour/half-hour queue congestion.
    # standalone-worker.mjs enforces the strict 2-hour rule and catches up automatically if GitHub delays a runner.
    - cron: '17 */2 * * *'
    - cron: '47 1-23/2 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  run-sublimation-bale:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Run Multi-Source Sublimation Discovery (Balad Map + Chapshoo + Divar + Aparat) & Bale Delivery
        env:
          BALE_BOT_TOKEN: '2136077232:6UYkuEA0H6FyPXbZB0lH38Hy1GjKpojSsv8'
          BALE_CHAT_ID: '4657775638'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node standalone-worker.mjs --once
          else
            node standalone-worker.mjs --cron
          fi
          git config user.name "Sublimation Cloud Bot"
          git config user.email "bot@sublimation.ir"
          git add work/ || true
          git diff --staged --quiet || (git commit -m "chore: auto-deliver new sublimation leads & advance crawler cursor [skip ci]" && git pull --rebase origin main && git push origin main)
